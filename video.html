  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  scroll-behavior: smooth;
}

body {
  font-family: 'Segoe UI', 'Inter', 'Roboto', Arial, sans-serif;
  background: linear-gradient(135deg, #f4f4f4 0%, #e0e7ff 100%);
  color: var(--text);
  transition: background 0.4s, color 0.3s;
  overflow-x: hidden;
  font-size: 1em;
  min-height: 100vh;
}

:root {
  --bg: #f4f4f4;
  --text: #22223b;
  --header-bg: #00d4ff;
  --footer-bg: #8b5cf6;
  --footer-text: #fff;
  --glass: rgba(255,255,255,0.65);
  --glass-dark: rgba(30,41,59,0.65);
  --shadow: 0 8px 32px rgba(0,0,0,0.18);
  --shadow-card: 0 4px 24px rgba(139,92,246,0.10), 0 1.5px 8px rgba(0,0,0,0.07);
  --accent: #8b5cf6;
  --accent2: #00d4ff;
  --accent3: #ec4899;
}

.dark {
  --bg: #181a20;
  --text: #f3f3f3;
  --footer-bg: #181a20;
  --glass: rgba(30,41,59,0.65);
  --glass-dark: rgba(0,0,0,0.65);
  --shadow: 0 8px 32px rgba(0,0,0,0.28);
  --shadow-card: 0 4px 24px rgba(139,92,246,0.18), 0 1.5px 8px rgba(0,0,0,0.17);
}


header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  padding: 1.5rem 2.5rem 1.2rem 2.5rem;
  background: linear-gradient(90deg, #00d4ff 0%, #8b5cf6 50%, #ec4899 100%);
  color: #fff;
  box-shadow: var(--shadow);
  border-bottom-left-radius: 32px;
  border-bottom-right-radius: 32px;
  flex-wrap: wrap;
  z-index: 10;
  min-height: 80px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.logo-container {
  display: flex;
  align-items: center;
  gap: 18px;
  background: var(--glass);
  border-radius: 18px;
  padding: 6px 18px 6px 6px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  transition: background 0.3s;
}

.logo-container img {
  height: 54px;
  width: 54px;
  border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  background: #fff;
  border: 2.5px solid #fff;
  object-fit: cover;
}

.logo-container h1 {
  font-size: 1.7rem;
  font-weight: 900;
  letter-spacing: 1.5px;
  background: linear-gradient(90deg, #00d4ff 0%, #8b5cf6 50%, #ec4899 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
  text-shadow: 0 2px 8px rgba(0,0,0,0.10);
  filter: brightness(1.1);
}

.toggle {
  background: var(--glass);
  color: var(--accent2);
  font-weight: 700;
  border: 1.5px solid var(--accent2);
  border-radius: 8px;
  padding: 10px 18px;
  cursor: pointer;
  font-size: 1rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  transition: background 0.2s, color 0.2s, border 0.2s, box-shadow 0.2s;
  margin-left: 18px;
  outline: none;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.toggle:hover, .toggle:focus {
  background: var(--accent2);
  color: #fff;
  border-color: var(--accent2);
  box-shadow: 0 4px 16px rgba(0,212,255,0.13);
}

.search-container {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 14px;
  margin: 32px 0 24px 0;
  background: var(--glass);
  border-radius: 18px;
  box-shadow: 0 2px 12px rgba(139,92,246,0.07);
  padding: 18px 10px;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}

.search-bar {
  width: 90%;
  max-width: 400px;
  padding: 12px 16px;
  border: 1.5px solid #bdbdbd;
  border-radius: 8px;
  font-size: 1.08rem;
  background: var(--glass);
  color: var(--text);
  box-shadow: 0 1.5px 8px rgba(139,92,246,0.06);
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
}
.search-bar:focus {
  border: 1.5px solid var(--accent);
  box-shadow: 0 2px 12px rgba(139,92,246,0.13);
}

.counter {
  font-weight: 700;
  background: linear-gradient(90deg, #00d4ff 0%, #8b5cf6 100%);
  color: #fff;
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 1.05rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  letter-spacing: 0.5px;
}

.container {
  display: flex;
  flex-wrap: wrap;
  gap: 28px;
  justify-content: center;
  padding: 1.5rem 0.5rem 2.5rem 0.5rem;
  min-height: 60vh;
}

.course {
  background: var(--glass);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  padding: 18px 12px 18px 12px;
  width: 100%;
  max-width: 320px;
  transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
  animation: fadeIn 0.7s cubic-bezier(.4,0,.2,1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1.5px solid rgba(139,92,246,0.08);
  margin-bottom: 0.5rem;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.course:hover {
  transform: translateY(-8px) scale(1.025);
  box-shadow: 0 8px 32px rgba(139,92,246,0.18), 0 2px 12px rgba(0,0,0,0.10);
  background: rgba(255,255,255,0.82);
  border-color: var(--accent);
}

.course h3 {
  text-align: center;
  margin-bottom: 12px;
  font-size: 1.08rem;
  color: var(--accent);
  font-weight: 800;
  letter-spacing: 0.2px;
  text-shadow: 0 1.5px 6px rgba(139,92,246,0.07);
}

iframe {
  width: 100%;
  height: 190px;
  border: none;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(139,92,246,0.10);
  background: #000;
}


footer {
  background: linear-gradient(90deg, #00d4ff 0%, #8b5cf6 60%, #ec4899 100%);
  color: #fff;
  text-align: center;
  padding: 40px 10px 28px 10px;
  font-size: 1.08rem;
  margin-top: 64px;
  border-top-left-radius: 32px;
  border-top-right-radius: 32px;
  box-shadow: 0 -8px 32px rgba(139,92,246,0.10);
  letter-spacing: 0.7px;
  font-weight: 700;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

#authModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.88);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  backdrop-filter: blur(2.5px);
  -webkit-backdrop-filter: blur(2.5px);
}

#authBox {
  background: var(--glass);
  padding: 28px 18px 22px 18px;
  border-radius: 18px;
  text-align: center;
  max-width: 95vw;
  width: 320px;
  box-shadow: 0 4px 24px rgba(139,92,246,0.13);
  border: 1.5px solid var(--accent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

#authBox input {
  padding: 12px 14px;
  border-radius: 8px;
  margin-bottom: 14px;
  width: 100%;
  font-size: 1.08rem;
  border: 1.5px solid #bdbdbd;
  background: var(--glass);
  color: var(--text);
  outline: none;
  box-shadow: 0 1.5px 8px rgba(139,92,246,0.06);
  transition: border 0.2s, box-shadow 0.2s;
}
#authBox input:focus {
  border: 1.5px solid var(--accent);
  box-shadow: 0 2px 12px rgba(139,92,246,0.13);
}

#authBox button {
  background: linear-gradient(90deg, #00d4ff 0%, #8b5cf6 100%);
  color: #fff;
  border: none;
  padding: 12px 28px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1.08rem;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(139,92,246,0.10);
  transition: background 0.2s, box-shadow 0.2s;
  outline: none;
}
#authBox button:hover, #authBox button:focus {
  background: linear-gradient(90deg, #8b5cf6 0%, #00d4ff 100%);
  box-shadow: 0 4px 16px rgba(139,92,246,0.13);
}

/* Responsive for tablets, mobiles, etc. */
@media (max-width: 900px) {
  .logo-container h1 {
    font-size: 1.1rem;
  }
  .logo-container img {
    height: 40px;
    width: 40px;
  }
  .search-bar {
    width: 90%;
  }
  iframe {
    height: 150px;
  }
  .container {
    gap: 16px;
  }
  .course {
    max-width: 98vw;
  }
}

@media (max-width: 600px) {
  header {
    flex-direction: column;
    align-items: flex-start;
    padding: 1.1rem 1rem 1.1rem 1rem;
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
  }
  .logo-container {
    justify-content: center;
    width: 100%;
    margin-bottom: 10px;
    border-radius: 12px;
    padding: 4px 10px 4px 4px;
  }
  .toggle {
    align-self: center;
    font-size: 0.92rem;
    margin-left: 0;
    margin-top: 8px;
  }
  .container {
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .search-container {
    flex-direction: column;
    padding: 12px 4px;
    border-radius: 12px;
  }
  .counter {
    font-size: 0.92rem;
    padding: 8px 14px;
    border-radius: 6px;
  }
  iframe {
    height: 120px;
  }
  .course {
    max-width: 99vw;
    border-radius: 12px;
    padding: 12px 4px 12px 4px;
  }
}

@media (max-width: 350px) {
  .search-bar {
    font-size: 0.85rem;
    padding: 8px 6px;
  }
  .course h3 {
    font-size: 0.9rem;
  }
  iframe {
    height: 90px;
  }
  .course {
    border-radius: 8px;
    padding: 8px 2px 8px 2px;
  }
}

    const container = document.getElementById("courseContainer");
    const count = document.getElementById("courseCount");

    function renderCourses(list) {
      container.innerHTML = "";
      list.forEach((c, i) => {
        const div = document.createElement("div");
        div.className = "course";
        div.style.animationDelay = `${i * 0.04}s`;
        div.innerHTML = `
          <h3>${c.title}</h3>
          <iframe src="${c.video}" allowfullscreen title="${c.title}"></iframe>
        `;
        container.appendChild(div);
      });
      count.textContent = `Total : ${list.length} cours`;
    }

    function filterCourses() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = courses.filter(c => c.title.toLowerCase().includes(q));
      renderCourses(filtered);
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");
    renderCourses(courses);
